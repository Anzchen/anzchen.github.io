    <!-- Icons live in public/ so Vite copies them verbatim. Anything under
         src/assets gets content-hashed into /assets/, which is why the old
         hardcoded /src/... URLs 404'd in production.
         Regenerate with: node scripts/make-icons.mjs -->

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Anthony Chen - Software Engineer and Finance student at Northeastern University. Building accessible, aesthetic, and adaptable solutions through software engineering." />
    <meta name="keywords" content="Anthony Chen, Software Engineer, Northeastern University, CS, Finance, Portfolio, React, Full Stack Developer" />
    <meta name="author" content="Anthony Chen" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anthonyzchen.com/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Anthony Chen, Software Engineer &amp; App Developer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anthony Chen | Software Engineer & Finance" />
    <meta name="twitter:description" content="Software Engineer and Finance student at Northeastern University. Building accessible, aesthetic, and adaptable solutions." />
    <meta name="twitter:image" content="https://anthonyzchen.com/og-image-1200x630.png" />

    <!-- Fonts: Fraunces (display) + KoHo (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=KoHo:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"

    <!-- <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.10/dist/lenis.css"> -->
    <!-- For FontAwesome icons -->
    <script src="https://kit.fontawesome.com/4e5c7b941c.js" crossorigin="anonymous"></script>
    <title>Anthony Chen | Software Engineer & Finance</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- GitHub Pages SPA redirect handler (pairs with public/404.html) -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
